<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fluid startup direction checks</title>
<style>
  body { margin: 24px; background: #071015; color: #e6eff1; font: 15px/1.6 system-ui; }
  canvas { display: block; margin-block: 20px; max-width: 100%; }
  [data-pass="false"] { color: #ff9b91; }
</style>
<h1>Fluid startup direction checks</h1>
<p id="status" role="status">Preparing graphics…</p>
<ol id="checks"></ol>
<div id="scenes"></div>
<script>
(async () => {
  const status = document.getElementById('status');
  let failures = 0, clock = 0, serial = 0, scene;
  const pending = new Map();
  const observations = [];
  function check(pass, label) {
    const item = document.createElement('li');
    item.dataset.pass = String(pass);
    item.textContent = (pass ? 'PASS · ' : 'FAIL · ') + label;
    document.getElementById('checks').append(item);
    if (!pass) failures++;
  }
  function center(x, wave, phase) {
    return wave[1] * (.13 * Math.sin(x * 4 * wave[2] + .85 + phase * .3) +
      .075 * Math.sin(x * 7 * wave[2] - 1) - .035 * Math.sin(x * 5 * wave[2] + phase + 1));
  }
  function derivative(x, wave, phase) {
    return (center(x + .0001, wave, phase) - center(x - .0001, wave, phase)) / .0002;
  }
  function sample(field, x, y) {
    const px = Math.min(field.width - 1, Math.max(0, Math.floor(x * field.width)));
    const py = Math.min(field.height - 1, Math.max(0, Math.floor(y * field.height)));
    const i = (py * field.width + px) * 4;
    return [field.pixels[i], field.pixels[i + 1], (px + .5) / field.width, (py + .5) / field.height];
  }
  try {
    const response = await fetch('../studies/fluid-prototype.js', { cache: 'no-store' });
    if (!response.ok) throw new Error('Renderer did not load');
    const source = await response.text();
    const create = new Function('requestAnimationFrame', 'cancelAnimationFrame', 'performance',
      source + '\nreturn window.FluidPrototype.create;')(
        callback => { const id = ++serial; pending.set(id, callback); return id; },
        id => pending.delete(id), { now: () => clock });
    for (const [width, height, seed] of [[640,360,101], [360,640,90210]]) {
      const canvas = document.createElement('canvas');
      canvas.style.width = width + 'px'; canvas.style.height = height + 'px';
      document.getElementById('scenes').append(canvas);
      const gl = canvas.getContext('webgl2');
      if (!gl) throw new Error('WebGL2 unavailable');
      const nativeDraw = gl.drawArrays.bind(gl);
      let initialField, finalShift, updates = 0;
      function readField() {
        const [, , w, h] = gl.getParameter(gl.VIEWPORT);
        const pixels = new Float32Array(w * h * 4);
        gl.readPixels(0, 0, w, h, gl.RGBA, gl.FLOAT, pixels);
        if (gl.getError() !== gl.NO_ERROR) throw new Error('Float field readback failed');
        return { width: w, height: h, pixels };
      }
      gl.drawArrays = (...args) => {
        nativeDraw(...args);
        const program = gl.getParameter(gl.CURRENT_PROGRAM);
        const uniform = key => {
          const location = gl.getUniformLocation(program, key);
          return location === null ? null : gl.getUniform(program, location);
        };
        if (uniform('field') === 1 && !initialField) {
          initialField = { ...readField(), wave: uniform('waveA'), phase: uniform('phase'),
            speed: uniform('flowSpeed'), aspect: uniform('aspect') };
        }
        if (uniform('dt') !== null && uniform('aspect') !== null && uniform('velocity') !== null) {
          updates++;
          if (updates === 126) finalShift = readField();
        }
      };
      scene = create(canvas, { randomized: true, seed, paused: true });
      const label = width > height ? 'Landscape' : 'Portrait';
      check(initialField?.speed > 0, label + ': startup uses the tangential field');
      scene.setPaused(false);
      for (let i = 0; i < 120; i++) {
        const callbacks = [...pending.values()]; pending.clear();
        clock += 1000 / 60;
        callbacks.forEach(callback => callback(clock));
        if (i % 20 === 0) {
          status.textContent = label + ': advancing ' + i + ' / 120 frames';
          await new Promise(resolve => setTimeout(resolve, 0));
        }
      }
      scene.setPaused(true);
      if (!initialField || !finalShift) throw new Error('Missing startup or transport samples');
      const { aspect, wave, phase } = initialField;
      const m = Math.min(aspect, 1), angle = wave[0] + .10 * Math.sin(phase);
      const c = Math.cos(angle), s = Math.sin(angle);
      let tangentError = 0, driftError = 0, driftLength = 0;
      for (const x of [-.3, -.15, 0, .15, .3]) {
        const y = center(x, wave, phase);
        const u = .5 + (c * x - s * y) * m / aspect;
        const v = .5 + (s * x + c * y) * m;
        const [vx, vy, su, sv] = sample(initialField, u, v);
        const px = (c * (su - .5) * aspect + s * (sv - .5)) / m;
        const wx = vx / initialField.width * aspect / m;
        const wy = vy / initialField.height / m;
        const tx = c * wx + s * wy, ty = -s * wx + c * wy;
        tangentError = Math.max(tangentError, Math.abs(ty - derivative(px, wave, phase) * tx) / Math.hypot(tx, ty));
        const [dx, dy, du, dv] = sample(finalShift, u, v);
        const qx = (c * (du - .5) * aspect + s * (dv - .5)) / m;
        const localX = c * dx + s * dy, localY = -s * dx + c * dy;
        driftError = Math.max(driftError, Math.abs(localY - derivative(qx, wave, phase) * localX) / Math.max(.000001, Math.hypot(localX, localY)));
        driftLength = Math.max(driftLength, Math.hypot(localX, localY));
      }
      check(tangentError < .003, label + ': seed velocity follows the strand tangent (normal fraction ' + tangentError.toFixed(5) + ')');
      check(driftLength > .002 && driftLength < .03, label + ': two-second startup drift is restrained (' + driftLength.toFixed(4) + ' material units)');
      check(driftError < .15, label + ': early transport stays along the rays (normal fraction ' + driftError.toFixed(4) + ')');
      observations.push({ label, seed, tangentError, driftError, driftLength });
      gl.drawArrays = nativeDraw;
      scene.dispose(); scene = null;
    }
    status.textContent = failures ? 'FAIL · ' + failures + ' checks failed' : 'PASS · All checks passed';
    document.body.dataset.result = failures ? 'fail' : 'pass';
    document.body.dataset.observations = JSON.stringify(observations);
  } catch (error) {
    status.textContent = 'ERROR · ' + error.message;
    document.body.dataset.result = 'error';
  } finally { scene?.dispose(); }
})();
</script>
</html>
