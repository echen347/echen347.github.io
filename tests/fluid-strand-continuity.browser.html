<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fluid strand continuity comparison</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 20px; background: #071015; color: #e6eff1; font: 14px/1.5 system-ui; }
  h1 { margin: 0; font-size: 22px; font-weight: 500; }
  p { margin: 6px 0 14px; color: #b2c7cf; }
  #variants { display: grid; grid-template-columns: repeat(2, 640px); gap: 18px; }
  figure { margin: 0; }
  h2 { margin: 0 0 6px; font-size: 17px; font-weight: 500; }
  canvas { display: block; width: 640px; height: 380px; background: #071015; }
  figcaption { padding-top: 6px; color: #b2c7cf; }
  output { display: block; color: #a4dbc2; }
  body[data-result="fail"] #status { color: #ff9b91; }
  @media (max-width: 1320px) { #variants { grid-template-columns: 640px; } }
</style>
<h1>Fluid strand continuity</h1>
<p>Seed 1949011526. All views use the same paused 640 × 380 canvas, startup flow, lighting, and antialiasing. Only the strand shader differs.</p>
<p id="status" role="status">Preparing comparison…</p>
<main id="variants"></main>
<script>
(async () => {
  const status = document.getElementById('status');
  const metrics = [];
  let scene;
  function replaceOnce(source, before, after) {
    if (source.split(before).length !== 2) throw new Error('Shader replacement did not match once: ' + before);
    return source.replace(before, after);
  }
  function previousStrands(source) {
    let previous = replaceOnce(source,
      'float turbulence=noise(q*9.0+phase)*.6+noise(q*23.0+curveIndex)*.15;',
      'float turbulence=noise(q*9.0+phase)*.6+noise(q*23.0+j)*.15;');
    previous = replaceOnce(previous,
      'float strand=(flowSpeed>0.0?q.y-bend:cross)*waveB.y+sin(q.x*8.0+curveIndex)*5.0+turbulence*9.0;',
      'float strand=cross*waveB.y+sin(q.x*8.0+j)*5.0+turbulence*9.0;');
    return replaceOnce(previous,
      'float pulse=flowSpeed>0.0 ? .32+.24*streaming :\n' +
      '            .18+.82*pow(noise(vec2(q.x*4.0+phase*.4,strand/6.2831853*.71+j*5.0)),2.0);',
      'float pulse=.18+.82*pow(noise(vec2(q.x*4.0+phase*.4,strand/6.2831853*.71+j*5.0)),2.0);');
  }
  try {
    const response = await fetch('../studies/fluid-prototype.js', { cache: 'no-store' });
    if (!response.ok) throw new Error('Could not load the production renderer');
    const source = await response.text();
    const variants = [
      ['Before', 'Independent strand phases and deeper brightness modulation.', previousStrands(source)],
      ['Current', 'Shared strand phase with gradual, bounded brightness variation.', source]
    ];
    for (const [title, description, variant] of variants) {
      status.textContent = 'Rendering ' + title.toLowerCase() + '…';
      const figure = document.createElement('figure');
      const heading = document.createElement('h2'); heading.textContent = title;
      const canvas = document.createElement('canvas'); canvas.setAttribute('aria-label', title);
      const caption = document.createElement('figcaption'); caption.textContent = description;
      const output = document.createElement('output');
      figure.append(heading, canvas, caption, output);
      document.getElementById('variants').append(figure);
      const create = new Function('requestAnimationFrame', 'cancelAnimationFrame', 'performance',
        variant + '\nreturn window.FluidPrototype.create;')(
          () => { throw new Error('Paused comparison scheduled an animation frame'); },
          () => {}, { now: () => 0 });
      scene = create(canvas, { randomized: true, seed: 1949011526, paused: true });
      if (canvas.dataset.state !== 'ready' || canvas.dataset.frames !== '0' || canvas.dataset.interactions !== '0')
        throw new Error(title + ': scene did not remain frozen');
      const gl = canvas.getContext('webgl2');
      const pixels = new Uint8Array(canvas.width * canvas.height * 4);
      gl.readPixels(0, 0, canvas.width, canvas.height, gl.RGBA, gl.UNSIGNED_BYTE, pixels);
      if (gl.getError() !== gl.NO_ERROR) throw new Error(title + ': WebGL error');
      let brightness = 0, brightPixels = 0;
      for (let i = 0; i < pixels.length; i += 4) {
        const light = .2126 * pixels[i] + .7152 * pixels[i + 1] + .0722 * pixels[i + 2];
        brightness += light; brightPixels += light > 180;
      }
      const mean = brightness / (pixels.length / 4);
      const brightPercent = brightPixels * 100 / (pixels.length / 4);
      output.textContent = 'Mean brightness ' + mean.toFixed(1) + '/255 · bright pixels ' + brightPercent.toFixed(2) + '%';
      metrics.push({ title, mean, brightPercent, width: canvas.width, height: canvas.height });
      scene.dispose(); scene = null;
    }
    if (metrics.some(value => value.width !== metrics[0].width || value.height !== metrics[0].height))
      throw new Error('Raster dimensions differ');
    status.textContent = 'Ready. Both views have zero advancing frames and no WebGL errors. Brightness statistics are not a continuity score.';
    document.body.dataset.result = 'pass';
    document.body.dataset.metrics = JSON.stringify(metrics);
  } catch (error) {
    status.textContent = 'FAIL · ' + error.message;
    document.body.dataset.result = 'fail';
  } finally { scene?.dispose(); }
})();
</script>
</html>
