<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Fluid transport checks</title>
<style>body{background:#101318;color:#dcecef;font:14px/1.6 system-ui;padding:24px}pre{white-space:pre-wrap}</style>
<h1>Fluid transport checks</h1><pre id="results">Running…</pre>
<script>
(async()=>{
  const output=document.getElementById('results'), lines=[];
  let passed=0,total=0;
  const check=(ok,label)=>{total++;passed+=Number(ok);lines.push(`${ok?'PASS':'FAIL'} ${label}`);};
  const canvas=document.createElement('canvas');canvas.width=64;canvas.height=64;
  const gl=canvas.getContext('webgl2');
  try {
    if(!gl || !gl.getExtension('EXT_color_buffer_float'))throw new Error('Floating point WebGL unavailable');
    const source=await(await fetch('../studies/fluid-prototype.js',{cache:'no-store'})).text();
    function shader(name){return source.match(new RegExp(name+': `([\\s\\S]*?)`[,\\n]'))[1];}
    function compile(type,code){const s=gl.createShader(type);gl.shaderSource(s,code);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s));return s;}
    function program(body){
      const p=gl.createProgram();gl.attachShader(p,compile(gl.VERTEX_SHADER,`#version 300 es
      out vec2 uv;void main(){vec2 p=vec2((gl_VertexID<<1)&2,gl_VertexID&2);uv=p;gl_Position=vec4(p*2.-1.,0,1);}`));
      gl.attachShader(p,compile(gl.FRAGMENT_SHADER,`#version 300 es
      precision highp float;precision highp sampler2D;in vec2 uv;out vec4 outColor;${body}`));
      gl.linkProgram(p);if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(p));return p;
    }
    function texture(size,make){
      const t=gl.createTexture(), data=new Float32Array(size*size*4);
      for(let y=0;y<size;y++)for(let x=0;x<size;x++)data.set(make(x,y),4*(y*size+x));
      gl.bindTexture(gl.TEXTURE_2D,t);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
      gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA16F,size,size,0,gl.RGBA,gl.FLOAT,data);return t;
    }
    const stripes=texture(256,x=>[x%2,x%2,x%2,1]);
    const velocity=texture(256,()=>[.375,0,0,1]);
    const target=gl.createFramebuffer();gl.bindFramebuffer(gl.FRAMEBUFFER,target);
    const result=texture(64,()=>[0,0,0,1]);gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,result,0);
    gl.bindVertexArray(gl.createVertexArray());gl.viewport(0,0,64,64);
    function bind(p,name,unit,t){gl.activeTexture(gl.TEXTURE0+unit);gl.bindTexture(gl.TEXTURE_2D,t);gl.uniform1i(gl.getUniformLocation(p,name),unit);}
    function pixel(){const v=new Float32Array(4);gl.readPixels(32,32,1,1,gl.RGBA,gl.FLOAT,v);return v[0];}
    const advection=program(shader('advection'));gl.useProgram(advection);
    bind(advection,'source',0,stripes);bind(advection,'velocity',1,velocity);
    gl.uniform2f(gl.getUniformLocation(advection,'texel'),1/256,1/256);gl.uniform1f(gl.getUniformLocation(advection,'dt'),1);gl.uniform1f(gl.getUniformLocation(advection,'dissipation'),0);
    gl.drawArrays(gl.TRIANGLES,0,3);
    const average=pixel();
    check(Math.abs(average-.5)<.003,`Compressed alternating strands retain their mean light: ${average.toFixed(5)} (expected 0.5)`);
    gl.uniform1f(gl.getUniformLocation(advection,'dissipation'),.38);
    gl.drawArrays(gl.TRIANGLES,0,3);
    const faded=pixel(),want=.5/1.38;
    check(Math.abs(faded-want)<.003,`Dye decay keeps the compressed mean: ${faded.toFixed(5)} (expected ${want.toFixed(5)})`);
    check(gl.getError()===gl.NO_ERROR,'Transport fixtures have no graphics errors');
  } catch(error){check(false,error.message);}
  gl?.getExtension('WEBGL_lose_context')?.loseContext();
  output.textContent=lines.join('\n')+`\n${passed}/${total} passed`;output.dataset.state=passed===total?'passed':'failed';
})();
</script></html>
